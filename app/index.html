<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ECR CI/CD Capstone Demo</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    h1 { font-size: 2.5rem; margin-bottom: 0.25rem; }
    .badge {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.5rem 1.5rem;
      border-radius: 999px;
      font-weight: bold;
      font-size: 1.25rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: #38bdf8;
      color: #0f172a;
    }
    p { color: #94a3b8; margin-top: 1.5rem; }
    code { background: #1e293b; padding: 0.2rem 0.5rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Docker → GitHub Actions → Amazon ECR</h1>
  <div class="badge">Environment: {{ENVIRONMENT}}</div>
  <p>Built and pushed automatically by GitHub Actions on pull request.<br />
  Image tag: <code>{{ENVIRONMENT}}-&lt;git-sha&gt;</code></p>
</body>
</html>
